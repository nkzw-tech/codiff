packages:
  - core
  - service
  - test
  - web

allowBuilds:
  '@google/genai': false
  '@nkzw/mdx-editor': true
  '@swc/core': true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  native-keymap: true
  node-pty: true
  protobufjs: false
  sharp: true
  workerd: true
blockExoticSubdeps: false
minimumReleaseAgeExclude:
  - '@nkzw/*'
  - void-fate
  - '@void/*'
  - react-fate
  - void
  - '@pierre/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.1.0
nodeLinker: hoisted
onlyBuiltDependencies:
  - '@nkzw/mdx-editor'
  - '@swc/core'
  - electron
  - electron-winstaller
  - unrs-resolver
overrides:
  # 1.6.3 was published with unresolved workspace/catalog references. These
  # versions match its source commit, 27bb17834cb273c23c09321f7c1590318b37dc11.
  '@pierre/diffs@1.6.3>@pierre/highlights': 0.4.0
  '@pierre/diffs@1.6.3>@pierre/theme': 2.0.0
  '@pierre/diffs@1.6.3>@pierre/theming': 1.0.2
  '@pierre/diffs@1.6.3>diff': 9.0.0
  '@pierre/diffs@1.6.3>hast-util-to-html': 9.0.5
  '@pierre/diffs@1.6.3>lru_map': 0.4.1
  extract-zip>yauzl: ^3.4.0
  vite@*: 'catalog:'
patchedDependencies:
  native-keymap@3.3.9: patches/native-keymap@3.3.9.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
