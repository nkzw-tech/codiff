packages:
  - core
  - service
  - test
  - web

allowBuilds:
  '@google/genai': false
  '@nkzw/mdx-editor': true
  '@swc/core': true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  native-keymap: true
  node-pty: true
  protobufjs: false
  sharp: true
  workerd: true
blockExoticSubdeps: false
minimumReleaseAgeExclude:
  - '@nkzw/*'
  - void-fate
  - '@void/*'
  - react-fate
  - void
  - '@pierre/*'
  - '@cloudflare/workers-types@5.20261117.1'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vitest: 5.1.0
nodeLinker: hoisted
onlyBuiltDependencies:
  - '@nkzw/mdx-editor'
  - '@swc/core'
  - electron
  - electron-winstaller
  - unrs-resolver
overrides:
  extract-zip>yauzl: ^3.4.0
  vite@*: 'catalog:'
patchedDependencies:
  '@pierre/diffs@1.6.4': patches/@pierre__diffs@1.6.4.patch
  native-keymap@3.3.9: patches/native-keymap@3.3.9.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
